name: CI - Simulation Verification & Quality Gates

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verify:
    name: Typecheck, Invariant Testing & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Static Typecheck & Linter (TypeScript)
        run: npm run lint

      - name: Execute Automated Acceptance & Invariant Suites (npm test)
        run: npm test

      - name: Execute 10 Adversarial Audit Tests
        run: npx tsx -e 'import { runAdversarialAudit } from "./src/simulation/adversarialAudit"; const res = runAdversarialAudit(); if (res.some(r => !r.passed)) process.exit(1);'

      - name: Verify Production Bundle Compilation
        run: npm run build
